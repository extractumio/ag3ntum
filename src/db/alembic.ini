# Alembic configuration file for Ag3ntum
# https://alembic.sqlalchemy.org/en/latest/

[alembic]
# Path to migrations directory, relative to this file
script_location = src/db/alembic

# Revision file naming — prefix with zero-padded sequence number
file_template = %%(rev)s_%%(slug)s

# Truncate the slug portion of auto-generated file names
truncate_slug_length = 40

# sqlalchemy.url is set at runtime in env.py — leave blank here
sqlalchemy.url =

# Timezone for revision timestamps
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
