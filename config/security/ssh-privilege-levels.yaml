# SSH Privilege Level Definitions
# Copy to ssh-privilege-levels.yaml and customize.
#
# Five tiers (L0-L4) with escalating capabilities:
# L0 = Monitoring (read-only, allowlist)
# L1 = Service Management (targeted sudo)
# L2 = Configuration (path-restricted writes)
# L3 = Administration (broad sudo, blocklist)
# L4 = Emergency (minimal filter, time-boxed)

privilege_levels:
  L0_monitoring:
    description: "Read-only monitoring and diagnostics"
    sudo_allowed: false
    command_mode: allowlist
    allowed_commands:
      # --- Basic navigation and identification ---
      - pattern: '^pwd$'
        description: "Show current directory"
      - pattern: '^hostname$'
        description: "Hostname"
      - pattern: '^whoami$'
        description: "Current user"
      - pattern: '^id$'
        description: "User identity"
      - pattern: '^date(\s+\+["''%\w\s.:-]+)?$'
        description: "Current date/time"
      - pattern: '^env$'
        description: "Environment variables"
      - pattern: '^which\s+[\w-]+$'
        description: "Command location"
      # --- Directory and file listing ---
      - pattern: '^ls(\s+-[laSrhta]+)*(\s+[\w/.~*-]+)*$'
        description: "List directory contents"
      # --- File reading ---
      - pattern: '^cat\s+/var/log/[\w/.+-]+$'
        description: "Read log files"
      - pattern: '^cat\s+[\w/.~-]+$'
        description: "Read file contents"
      - pattern: '^head(\s+-[n]?\s*\d+)?\s+[\w/.~-]+$'
        description: "Head file contents"
      - pattern: '^head\s+-[n]?\s*\d+$'
        description: "Head first N lines (pipe target)"
      - pattern: '^tail\s+-[nf]\s+\d*\s+/var/log/[\w/.+-]+$'
        description: "Tail log files"
      - pattern: '^tail(\s+-[nf]\s*\d*)?\s+[\w/.~-]+$'
        description: "Tail file contents"
      - pattern: '^tail\s+-[n]?\s*\d+$'
        description: "Tail last N lines (pipe target)"
      - pattern: '^grep\s+.*\s+/var/log/[\w/.+-]+$'
        description: "Search log files"
      - pattern: '^grep(\s+-[rilnHcvEw]+)*\s+(".*?"|''.*?''|[\w.*-]+)\s+[\w/.~-]+$'
        description: "Search any file for patterns"
      - pattern: '^wc\s+-[lwc]+\s+[\w/.~-]+$'
        description: "Word/line/char count of a file"
      - pattern: '^du\s+-[sh]+(\s+[\w/.~*-]+)+$'
        description: "Directory disk usage with glob"
      # --- File metadata ---
      - pattern: '^file\s+[\w/.~-]+$'
        description: "File type identification"
      - pattern: '^stat\s+[\w/.~-]+$'
        description: "File metadata"
      # --- Disk and storage ---
      - pattern: '^df\s+-[hT]+$'
        description: "Disk usage"
      - pattern: '^du\s+-[sh]+(\s+[\w/.~-]+)?$'
        description: "Directory disk usage"
      # --- System info ---
      - pattern: '^free\s+-[hm]+$'
        description: "Memory usage"
      - pattern: '^uptime$'
        description: "System uptime"
      - pattern: '^uname\s+-[a]+$'
        description: "System info"
      - pattern: '^ps\s+aux$'
        description: "Process list"
      - pattern: '^cat\s+/etc/os-release$'
        description: "OS version"
      # --- Service and journal ---
      - pattern: '^systemctl\s+status\s+[\w@.-]+$'
        description: "Check service status"
      - pattern: '^journalctl\s+(-u\s+[\w@.-]+\s+)?--no-pager(\s+-n\s+\d+)?$'
        description: "Read journal logs"
      - pattern: '^journalctl\s+(-u\s+(ssh|sshd|[\w@.-]+)\s+)?(--since|--until)\s+["''\w\s:.-]+(\s+--no-pager)?(\s+-n\s+\d+)?$'
        description: "Read journal logs in a bounded time window"
      # --- Pipeline helpers ---
      - pattern: '^wc\s+-[lwc]+$'
        description: "Word/line/char count (pipe target)"
      - pattern: '^sort(\s+-[rnuk]+)*$'
        description: "Sort output (pipe target)"
      - pattern: '^uniq(\s+-c)?$'
        description: "Unique filter (pipe target)"
      # --- Network diagnostics ---
      - pattern: '^netstat\s+-[tlnup]+$|^ss\s+-[tlnup]+$'
        description: "Network connections"
      - pattern: '^ip\s+(addr|route|link)\s*(show)?(\s+[\w.-]+)?$'
        description: "Network configuration"
      - pattern: '^dig\s+[\w.-]+$'
        description: "DNS lookup"
      - pattern: '^ping\s+-c\s+\d+\s+[\w.-]+$'
        description: "Network connectivity"
      - pattern: '^openssl\s+s_client\s+-connect\s+[\w.-]+:\d+$'
        description: "SSL certificate check"
      # --- Find and locate ---
      - pattern: '^find\s+[\w/.~-]+\s+-name\s+[''"\w.*-]+(\s+-type\s+[fd])?$'
        description: "Find files by name"
      # --- Authentication diagnostics ---
      - pattern: '^last(\s+-[fniwxR]+)*(\s+[\w.-]+)?$'
        description: "Recent login history"
      - pattern: '^lastb(\s+-[fniwxR]+)*(\s+[\w.-]+)?$'
        description: "Recent failed login history"
      - pattern: '^faillog(\s+-[au])?(\s+[\w.-]+)?$'
        description: "Failed login counters"
      - pattern: '^grep\s+.*\s+/var/log/(auth\.log|secure)(\.\d+)?$'
        description: "Search SSH authentication logs"
      - pattern: '^tail\s+-[nf]\s+\d*\s+/var/log/(auth\.log|secure)(\.\d+)?$'
        description: "Tail SSH authentication logs"
      # --- Runtime and config checks ---
      - pattern: '^nginx\s+-t$|^apache2ctl\s+-t$|^httpd\s+-t$'
        description: "Config syntax check"
      - pattern: '^php\s+-v$|^python3?\s+--version$|^node\s+--version$'
        description: "Runtime version check"
      - pattern: '^docker\s+ps(\s+-a)?$|^docker\s+stats\s+--no-stream$'
        description: "Container status"
      # WordPress wp-cli read-only commands
      - pattern: '^wp\s+(plugin|theme|core)\s+(list|status|version|verify-checksums)(\s+--[\w-]+(=\S+)?)*$'
        description: "wp-cli read-only listing/version commands"
      - pattern: '^wp\s+db\s+(check|size)(\s+--[\w-]+(=\S+)?)*$'
        description: "wp-cli database health check"
      - pattern: '^wp\s+option\s+get\s+[\w_-]+$'
        description: "wp-cli read single option"
      - pattern: '^wp\s+post\s+list(\s+--[\w-]+(=\S+)?)*$'
        description: "wp-cli list posts"
      - pattern: '^wp\s+user\s+list(\s+--[\w-]+(=\S+)?)*$'
        description: "wp-cli list users"
      - pattern: '^wp\s+cron\s+(event\s+list|test)$'
        description: "wp-cli cron inspection"
      - pattern: '^wp\s+config\s+list(\s+--[\w-]+(=\S+)?)*$'
        description: "wp-cli config listing (secrets auto-redacted by wp-cli)"
      - pattern: '^wp\s+(cache|transient)\s+list(\s+--[\w-]+(=\S+)?)*$'
        description: "wp-cli cache/transient listing"
      - pattern: '^wp\s+search-replace\s+.*--dry-run(\s+--[\w-]+(=\S+)?)*$'
        description: "wp-cli search-replace dry run only"

  L1_service_management:
    description: "Service restart and cache management"
    sudo_allowed: true
    sudo_restricted_to:
      - '^sudo\s+systemctl\s+(restart|reload|start|stop|status)\s+[\w@.-]+$'
      - '^sudo\s+service\s+[\w.-]+\s+(restart|reload|start|stop)$'
      - '^sudo\s+nginx\s+-s\s+(reload|reopen)$'
      - '^sudo\s+apachectl\s+graceful$'
    allowed_commands:
      # WordPress wp-cli operational commands (no sudo needed — runs as web user)
      - pattern: '^wp\s+plugin\s+update\s+[\w-]+(\s+--[\w-]+(=\S+)?)*$'
        description: "wp-cli update a plugin"
      - pattern: '^wp\s+theme\s+update\s+[\w-]+(\s+--[\w-]+(=\S+)?)*$'
        description: "wp-cli update a theme"
      - pattern: '^wp\s+core\s+update(\s+--[\w-]+(=\S+)?)*$'
        description: "wp-cli update WordPress core"
      - pattern: '^wp\s+cache\s+flush$'
        description: "wp-cli flush object cache"
      - pattern: '^wp\s+rewrite\s+flush(\s+--hard)?$'
        description: "wp-cli flush rewrite rules"
      - pattern: '^wp\s+db\s+optimize$'
        description: "wp-cli optimize database"
      - pattern: '^wp\s+db\s+repair$'
        description: "wp-cli repair database"
      - pattern: '^wp\s+transient\s+delete\s+--all$'
        description: "wp-cli delete all transients"
      - pattern: '^wp\s+plugin\s+(activate|deactivate)\s+[\w-]+$'
        description: "wp-cli activate/deactivate plugin"
    inherits: L0_monitoring
    human_approval: per_session

  L2_configuration:
    description: "Configuration file editing"
    sudo_allowed: true
    writable_paths:
      - '/etc/nginx/'
      - '/etc/apache2/'
      - '/etc/caddy/'
      - '/etc/php/'
      - '/etc/mysql/'
      - '/etc/postgresql/'
      - '/etc/redis/'
      - '/etc/letsencrypt/'
      - '/etc/systemd/system/'
    blocked_paths:
      - '/etc/shadow'
      - '/etc/passwd'
      - '/etc/sudoers'
      - '/etc/ssh/sshd_config'
      - '/etc/pam.d/'
    inherits: L1_service_management
    human_approval: per_write_command

  L3_administration:
    description: "Full system administration"
    sudo_allowed: true
    command_mode: blocklist
    blocked_commands:
      # rm targeting root — catches: rm -rf /, rm -fr /, rm -r -f /, sudo rm -rf /, rm /*
      - pattern: '\brm\s+(-\w+\s+)*/(\s|$|\*)'
        description: "Delete root filesystem (any flag order)"
      # rm --recursive targeting root
      - pattern: '\brm\s+.*--recursive.*\s+/(\s|$|\*)'
        description: "Delete root filesystem (long flags)"
      # rm -r on critical system directories (only top-level, not subdirs)
      - pattern: '\brm\s+.*-\w*[rR].*\s+/(boot|usr|etc|var|lib|sbin|bin)/?\s*$'
        description: "Recursive delete of critical system directory"
      - pattern: ':\(\)\{.*\|.*&.*\};:'
        description: "Fork bomb"
      - pattern: 'dd\s+.*of=/dev/[sh]d[a-z]'
        description: "Raw disk overwrite"
      - pattern: 'mkfs\.'
        description: "Format filesystem"
      - pattern: '>\s*/dev/[sh]d[a-z]'
        description: "Redirect to disk device"
      # chmod 777 — catches: chmod -R 777 /, chmod 777 /path, chmod -R 777 /path
      - pattern: '\bchmod\s+(-\w+\s+)*777\s+/'
        description: "World-writable chmod on system paths"
      - pattern: 'shutdown\s+(-h\s+)?now|halt|poweroff|init\s+0'
        description: "System shutdown"
      - pattern: 'reboot|init\s+6'
        description: "System reboot"
    inherits: L2_configuration
    human_approval: per_command

  L4_emergency:
    description: "Emergency unrestricted access"
    sudo_allowed: true
    command_mode: blocklist
    blocked_commands:
      - pattern: '\brm\s+(-\w+\s+)*/(\s|$|\*)'
        description: "Delete root filesystem (any flag order)"
      - pattern: '\brm\s+.*--recursive.*\s+/(\s|$|\*)'
        description: "Delete root filesystem (long flags)"
      - pattern: ':\(\)\{.*\|.*&.*\};:'
        description: "Fork bomb"
    max_session_duration_seconds: 1800
    requires_reauthentication: true
    human_approval: per_command

# Commands ALWAYS blocked regardless of privilege level
always_blocked:
  persistence:
    - pattern: '>>?\s*.*authorized_keys'
      description: "SSH key injection"
    - pattern: 'crontab\s+-[el]?|>>?\s*.*cron'
      description: "Cron job modification"
    - pattern: 'systemctl\s+(enable|disable|mask)'
      description: "Systemd service modification"
    - pattern: '/etc/init\.d|update-rc\.d|chkconfig'
      description: "Init script modification"
    - pattern: 'ld\.so\.preload|LD_PRELOAD'
      description: "Library preloading"

  lateral_movement:
    - pattern: '(?:^|[;&|]\s*)ssh\s+'
      description: "Nested SSH"
    - pattern: '\bscp\s+'
      description: "SCP from remote"
    - pattern: '\bcurl\s+.*\|\s*(bash|sh|python)'
      description: "Download and execute"
    - pattern: '\bwget\s+.*-O\s*-\s*\|'
      description: "Download and pipe"
    - pattern: '\bnc\s+-[lp]|\bncat\s+-[lp]|\bsocat\b'
      description: "Reverse shell / listener"
    - pattern: '169\.254\.169\.254'
      description: "Cloud metadata endpoint"
    - pattern: 'base64\s+(-d|--decode).*\|\s*(bash|sh|python|perl)'
      description: "Base64 decode piped to interpreter"
    - pattern: '\bbash\s+-c\b'
      description: "Bash inline execution"
    - pattern: '\bsh\s+-c\b'
      description: "Shell inline execution"
    - pattern: '\bpython3?\s+-c\b'
      description: "Python inline execution"
    - pattern: '\bperl\s+-e\b'
      description: "Perl inline execution"

  shell_expansion:
    - pattern: '\$\('
      description: "Command substitution (subshell)"
    - pattern: '`'
      description: "Backtick command substitution"
    - pattern: '\$\{'
      description: "Variable expansion with braces"
    - pattern: '\beval\b'
      description: "Shell eval execution"
    - pattern: '\bexec\b\s'
      description: "Shell exec replacement"
    - pattern: '\bsource\b\s|\.\s+/'
      description: "Shell source/dot execution"
    - pattern: '\$[A-Za-z_]'
      description: "Shell variable reference ($VAR)"

  output_redirect:
    - pattern: '>\s*/etc/'
      description: "Redirect output to /etc/"
    - pattern: '>\s*/root/'
      description: "Redirect output to /root/"
    - pattern: '>\s*~/\.ssh/'
      description: "Redirect output to .ssh directory"
    - pattern: '>\s*/var/spool/cron'
      description: "Redirect output to cron directory"
    - pattern: '\btee\s+'
      description: "Tee output to file (use SSHWrite instead)"
    - pattern: '>\s*/var/www/'
      description: "Redirect to web root (use SSHWrite instead)"
    - pattern: '\bdd\s+.*of='
      description: "dd write to file (use SSHWrite instead)"
    - pattern: '\bsed\s+-i\b'
      description: "In-place file modification (use SSHWrite instead)"

  data_exfiltration_require_approval:
    - pattern: '\bmysqldump\b|\bpg_dump\b'
      description: "Database dump"
    - pattern: '\btar\s+.*-[cz].*\/'
      description: "Archive creation"
    - pattern: 'cat\s+.*\.(env|key|pem|p12|pfx|jks)\b'
      description: "Sensitive file read"

# Patterns redacted from command output (stdout/stderr) before
# returning to the agent.  Each entry has a regex 'pattern' and a
# 'replacement' string (may use backreferences like \1).
output_redaction:
  - pattern: "define\\(\\s*'DB_PASSWORD'\\s*,\\s*'[^']+'\\s*\\)"
    replacement: "define('DB_PASSWORD', '[REDACTED]')"
    description: "WordPress DB_PASSWORD"
  - pattern: "define\\(\\s*'DB_USER'\\s*,\\s*'[^']+'\\s*\\)"
    replacement: "define('DB_USER', '[REDACTED]')"
    description: "WordPress DB_USER"
  - pattern: '(?i)password\s*[=:]\s*\S+'
    replacement: 'password=[REDACTED]'
    description: "Generic password value"
  - pattern: '(?i)(api[_-]?key|secret[_-]?key|auth[_-]?token)\s*[=:]\s*\S+'
    replacement: '\1=[REDACTED]'
    description: "API keys and tokens"
