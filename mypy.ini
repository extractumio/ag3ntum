[mypy]
python_version = 3.13
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True
check_untyped_defs = False
# Start permissive, tighten incrementally

[mypy-src.core.*]
check_untyped_defs = True
# Core is the most critical — check it first

[mypy-tests.*]
ignore_errors = True
