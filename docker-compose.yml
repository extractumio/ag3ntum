# Ag3ntum Docker Compose Configuration
#
# Environment Variables:
#   AG3NTUM_IMAGE_TAG  - Docker image tag (default: latest)
#   AG3NTUM_API_PORT   - API port on host (default: 40080)
#   AG3NTUM_WEB_PORT   - Web UI port on host (default: 50080)
#   AG3NTUM_REDIS_PORT - Redis debug port on host (default: 46379)
#   AG3NTUM_UID_MODE   - UID mapping mode: "isolated" (default) or "direct"
#   AG3NTUM_MODE       - Deployment mode: "prod" (default) or "dev"
#
# Deployment Modes:
#   prod (default): Web container serves pre-built static bundle (fast startup)
#   dev:            Web container runs Vite dev server with HMR (see docker-compose.dev.yml)
#
# Both modes use two ports:
#   - WEB_PORT (50080): Web UI
#   - API_PORT (40080): API endpoint
#
# UID Security Modes:
#   isolated (default): UIDs 50000-60000, doesn't map to host users (multi-tenant safe)
#   direct:             UIDs 1000-65533, maps to host users (dev/single-tenant)
#
# Usage:
#   ./run.sh build           # Build and start (handles permissions automatically)
#   docker compose up -d     # Start existing containers
#   docker compose down      # Stop containers
#
# See QUICK-START-GUIDE.md for detailed deployment instructions.

services:
  ag3ntum-api:
    image: ag3ntum:${AG3NTUM_IMAGE_TAG:-latest}
    build: .
    # Runs as ag3ntum_api (UID 45045) as defined in Dockerfile
    # Do NOT override with user: directive - breaks sudo inside container
    entrypoint: ["/entrypoint-api.sh"]
    command:
      - python
      - -m
      - uvicorn
      - src.api.main:app
      - --host=0.0.0.0
      - --port=40080
    environment:
      AG3NTUM_ROOT: "/"
      PYTHONPATH: "/"
      # UID Security Mode: "isolated" (default, multi-tenant safe) or "direct" (host mapping)
      AG3NTUM_UID_MODE: "${AG3NTUM_UID_MODE:-isolated}"
    volumes:
      - ./config:/config
      - ./data:/data
      - ./logs:/logs
      - ./src:/src:ro
      - ./users:/users
      - ./prompts:/prompts:ro
      - ./skills:/skills:ro
      - ./tools:/tools:ro
      - ./tests:/tests:ro
      - ./scripts:/scripts:ro
      - ./auto-generated:/auto-generated:ro
    ports:
      - "${AG3NTUM_API_PORT:-40080}:40080"
    cap_add:
      - SYS_ADMIN
      # CAP_SETUID and CAP_SETGID required for privilege dropping in sandbox
      # Security is enforced at application level in src/core/uid_security.py:
      # - Root (UID 0) is ALWAYS blocked
      # - System accounts (1-999) are blocked
      # - UIDs must be in configured range (isolated: 2000-60000, direct: 1000-65533)
      # - Session UID enforcement prevents cross-user access
      - SETUID
      - SETGID
      # CAP_CHOWN required for setting workspace ownership to sandbox user's UID
      # This allows session directories to be accessible by the sandboxed process
      - CHOWN
    security_opt:
      - apparmor:unconfined
      # Container-level seccomp: default-deny allowlist permitting bwrap, privilege
      # management, and standard operations. Blocks ptrace, kexec, reboot, etc.
      - seccomp:./config/security/seccomp-container.json
    depends_on:
      - redis
    restart: unless-stopped

  ag3ntum-web:
    image: ag3ntum:${AG3NTUM_IMAGE_TAG:-latest}
    build: .
    # Production mode (default): serves pre-built static bundle from /web_dist.
    # Dev mode overrides command/volumes via docker-compose.dev.yml for Vite HMR.
    entrypoint: ["/entrypoint-web.sh"]
    command:
      - python3
      - -m
      - uvicorn
      - src.web_frontend_server:app
      - --host=0.0.0.0
      - --port=50080
    environment:
      AG3NTUM_ROOT: "/"
      PYTHONPATH: "/"
      AG3NTUM_MODE: "${AG3NTUM_MODE:-prod}"
    volumes:
      - ./config:/config
      - ./logs:/logs
      - ./src:/src:ro
      # Mount generated config.yaml into the static bundle so port/hostname
      # changes take effect on restart without requiring a full image rebuild.
      - ./src/web_terminal_client/public/config.yaml:/web_dist/config.yaml:ro
    ports:
      - "${AG3NTUM_WEB_PORT:-50080}:50080"
    depends_on:
      - ag3ntum-api
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "127.0.0.1:${AG3NTUM_REDIS_PORT:-46379}:6379"
    restart: unless-stopped

# Named volumes: web_node_modules defined in docker-compose.dev.yml (dev mode only)
